services:
  - type: web
    name: tensormesh-rpa
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: NEBIUS_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
